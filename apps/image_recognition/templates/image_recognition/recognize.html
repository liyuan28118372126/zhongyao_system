{% extends 'base.html' %}

{% block title %}图像识别 - 中药系统{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">
                        <i class="fas fa-camera text-success fa-2x"></i>
                    </h3>
                    <h4 class="text-center mb-4">中药图像识别</h4>
                    
                    <p class="text-center text-muted mb-4">
                        上传中药材图片，AI智能识别药材名称和功效
                    </p>
                    
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label for="id_image" class="form-label">选择图片</label>
                            <input type="file" name="image" class="form-control" id="id_image" accept="image/*" required>
                            <small class="form-text text-muted">支持JPG、PNG、GIF格式，最大5MB</small>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success w-100">
                                <i class="fas fa-search me-2"></i>开始识别
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
