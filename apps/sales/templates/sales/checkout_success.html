{% extends 'base.html' %}

{% block title %}订单提交成功 - 中药系统{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card text-center">
                <div class="card-body">
                    <div class="mb-4">
                        <i class="fas fa-check-circle text-success fa-4x"></i>
                    </div>
                    <h2 class="text-success mb-3">订单提交成功！</h2>
                    <p class="text-muted mb-4">您的订单已成功提交，感谢您的购买！</p>
                    
                    <div class="card bg-light p-4 mb-4">
                        <h5 class="mb-3">订单信息</h5>
                        <div class="row text-left">
                            <div class="col-md-6 mb-2">
                                <span class="text-muted">订单编号:</span>
                                <span class="ms-2">{{ order.id }}</span>
                            </div>
                            <div class="col-md-6 mb-2">
                                <span class="text-muted">下单时间:</span>
                                <span class="ms-2">{{ order.created_at|date:'Y-m-d H:i:s' }}</span>
                            </div>
                            <div class="col-md-6 mb-2">
                                <span class="text-muted">订单状态:</span>
                                <span class="ms-2 text-success">{{ order.get_status_display }}</span>
                            </div>
                            <div class="col-md-6 mb-2">
                                <span class="text-muted">总金额:</span>
                                <span class="ms-2 text-success">¥{{ order.total_price }}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <a href="{% url 'sales:product_list' %}" class="btn btn-success">
                            <i class="fas fa-shopping-bag me-2"></i>继续购物
                        </a>
                        <a href="{% url 'medicine:index' %}" class="btn btn-outline-secondary">
                            <i class="fas fa-home me-2"></i>返回首页
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
